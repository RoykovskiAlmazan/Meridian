name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src

      - name: Pytest
        run: pytest tests/ -v

      - name: Byte-compile (catches syntax errors in all subagents/gateways)
        run: python -m py_compile $(find src -name "*.py")
