[project]
name = "meridian"
version = "0.1.0"
description = "Meridian (codename: Project Foreman) - multi-agent orchestration platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "hvac>=2.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "jsonschema>=4.22",
    "croniter>=2.0",
    "requests>=2.31",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fakeredis>=2.23",
]
# DB_BACKEND=mssql requiere además el driver ODBC de Microsoft instalado a nivel de SO
# (no es instalable solo con pip) -- ver docs/design/0017-database-compatibility.md.
mssql = [
    "pyodbc>=5.1",
]

[project.scripts]
meridianctl = "meridian.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
