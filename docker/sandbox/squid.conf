# Egress proxy para subagentes -- ver docs/design/0004-sandbox-exec-model.md
#
# Default seguro: sin ACL de dominio que lo permita explícitamente, todo se deniega
# (http_access deny all al final). Un subagente nuevo NO tiene salida a internet hasta
# que alguien agregue su IP fija + sus dominios permitidos aquí.

http_port 3128

acl localnet src 172.28.1.0/24

# ---- sample_subagent_a (172.28.1.10) ----
# Subagente de prueba (echo), sin llamadas externas todavía -- sin dominios permitidos.
acl subagent_a src 172.28.1.10/32
acl subagent_a_allowed_domains dstdomain .invalid-placeholder-no-domains-yet.example

# ---- sample_subagent_b (172.28.1.11) ----
# Subagente de prueba (echo), sin llamadas externas todavía -- sin dominios permitidos.
acl subagent_b src 172.28.1.11/32
acl subagent_b_allowed_domains dstdomain .invalid-placeholder-no-domains-yet.example

# ---- paper_search (172.28.1.12) y paper_summarizer (172.28.1.13) ----
# Caso de prueba de dominio real (docs/design/0007-paper-search-app.md): buscan en arXiv.
# Solo necesitan ese dominio, nada más -- allowlist mínima, no "todo internet por si acaso".
acl subagent_paper_search src 172.28.1.12/32
acl subagent_paper_search_allowed_domains dstdomain .arxiv.org

acl subagent_paper_summarizer src 172.28.1.13/32
acl subagent_paper_summarizer_allowed_domains dstdomain .arxiv.org .anthropic.com .openai.com

# Cuando exista otro subagente de dominio real, agregar aquí su IP fija + su(s) dominio(s)
# permitido(s), siguiendo el mismo patrón, ANTES del "http_access deny all" de abajo.

http_access allow subagent_a subagent_a_allowed_domains
http_access allow subagent_b subagent_b_allowed_domains
http_access allow subagent_paper_search subagent_paper_search_allowed_domains
http_access allow subagent_paper_summarizer subagent_paper_summarizer_allowed_domains
http_access deny all

coredump_dir /var/spool/squid
